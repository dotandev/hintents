[package]
name = "erst-sim"
version = "0.1.0"
edition = "2021"

[lints.rust]
unused_variables = "warn"
unused_imports = "warn"
unused_mut = "warn"
dead_code = "warn"
unused_assignments = "warn"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"

[dependencies]
# soroban-env-host major version == Soroban protocol version.
# Pinned to the 27.x line (protocol 27): testnet contracts already target
# protocol 26/27 and a host below that rejects them with "contract protocol
# number is newer than host". 27.0.1 is also the last version before 28.0.0
# made Storage/Footprint/FootprintMap/StorageMap and
# Storage::with_enforcing_footprint_and_map crate-private, which this
# simulator's footprint-enforcement code still relies on directly — moving
# past 27.x needs that code rewritten against SnapshotSource first.
soroban-env-host = { version = ">=27.0, <28", features = ["testutils"] }
base64 = "0.21"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
inferno = "0.12.8"
jsonschema = "0.40.2"
object = { version = "0.40.0", features = ["wasm"] }
gimli = "0.31"
wasmparser = "0.255.0"
blake3 = "1"
dirs = "6.0.0"
hex = "0.4.3"
bincode = "1.3.3"
async-trait = "0.1.89"
dashmap = "6"
thiserror = "2.0.18"
libloading = "0.8"
colored = "2.1"
ed25519-dalek = { version = "2.2.0", features = ["pem", "pkcs8"] }
k256 = { version = "0.13.4", features = ["ecdsa", "pem"] }
pem-rfc7468 = { version = "0.7.0", features = ["alloc"] }
rand = "0.8"
tokio = { version = "1.49.0", features = ["time"] }
libc = "0.2"
zstd = "0.13"
regex = "1.12.3"
once_cell = "1.21.4"
prost = "0.12"
memmap2 = "0.9"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15", features = ["prost-codec"], default-features = false }

[dev-dependencies]
tempfile = "3.26.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
wat = "1"
