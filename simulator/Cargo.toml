[package]
name = "simulator"
version = "0.1.0"
edition = "2021"

[lints.rust]
unused_variables = "deny"
unused_imports = "deny"
unused_mut = "deny"
dead_code = "deny"
unused_assignments = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"

[[example]]
name = "hsm_test"
path = "examples/hsm_test.rs"

[dependencies]
# soroban-env-host major version == Soroban protocol version.
# Protocol 21 (v21.x) introduced DiagnosticLevel, get_events(), and the
# HostedContractEvent.failed_call field that this simulator relies on.
# We accept any release in the 21-25 range so the binary stays compatible
# with both mainnet protocol 21 and subsequent minor protocol bumps.
soroban-env-host = { version = ">=21.0, <26" } # Updated to latest version
base64 = "0.21"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
inferno = "0.11"
jsonschema = "0.40.2"
object = "0.38.1"
gimli = "0.31"

# HSM and cryptographic dependencies
pkcs11 = "0.5"
libloading = "0.8"
ed25519-dalek = "2.0"
p256 = "0.13"
signature = "2.0"
rand = "0.8"
tokio = { version = "1.0", features = ["rt", "macros", "rt-multi-thread"] }
thiserror = "1.0"
env_logger = "0.11"
async-trait = "0.1"
wat = "1.0"
dirs = "5.0"
hex = "0.4"
bincode = "1.3"
wasmparser = "0.245"
sha2 = "0.10"
tempfile = "3.8"
