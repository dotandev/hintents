      # rather than one per package. Five projects at the usual limit would
      # have put up to 25 PRs a week on a review queue that already carries
      # the contributor backlog, and a security update nobody has time to look
      # at is not a security update. Majors still come through individually,
      # because those need reading.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm - erst-playground
