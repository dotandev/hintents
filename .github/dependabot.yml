version: 2
updates:
  # Rust / Cargo - simulator (soroban-env-host and related dependencies)
  - package-ecosystem: "cargo"
    directory: "/simulator"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "auto"
    groups:
      soroban:
        dependency-type: "production"
        patterns:
          - "soroban-*"

  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "auto"

  # npm - erst_extension
  - package-ecosystem: "npm"
    directory: "/erst_extension"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "auto"

  # npm - docs/showcase
  - package-ecosystem: "npm"
    directory: "/docs/showcase"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "auto"

  # npm - root (stellar-sdk, axios, chalk, pkcs11js)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "auto"
    groups:
      # Everything routine arrives as one pull request a week per project
      # rather than one per package. Five projects at the usual limit would
      # have put up to 25 PRs a week on a review queue that already carries
      # the contributor backlog, and a security update nobody has time to look
      # at is not a security update. Majors still come through individually,
      # because those need reading.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm - erst-ui (deployed to Vercel)
  - package-ecosystem: "npm"
    directory: "/erst-ui"
